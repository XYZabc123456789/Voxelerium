[package]
name = "Voxelerium"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true

[dependencies]
utils = { workspace = true }
glam = { workspace = true, features = ["serde"] }
renderer = { workspace = true }
slotmap = { workspace = true, features = ["unstable"] }
wgpu = { workspace = true, features = ["serde"] }
winit = { workspace = true, features = ["serde"] }
variadics = { workspace = true }
rayon = { workspace = true }
core_affinity2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "tracing"] }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "serde", "tracing", "tracing-serde"] }
anyhow = { workspace = true }

[[bin]]
name = "voxelerium"
path = "src/main.rs"

[lints]
workspace = true
