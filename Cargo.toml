[workspace]
resolver = "3"
members = ["Voxelerium", "Renderer", "Utils", "macros"]

[workspace.package]
authors = ["XYZabc123456789 <264301988+XYZabc123456789@users.noreply.github.com>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
glam = "0.34.1"
renderer = { version = "0.1.0", path = "Renderer" }
slotmap = "1.1.1"
utils = { version = "0.1.0", path = "Utils" }
wgpu = "30.0.1"
winit = "0.30.13"
variadics = "0.1.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"
macros = { version = "0.1.0", path = "macros" }
rayon = "1.12.0"
core_affinity2 = "0.16.1"
tokio = "1.54.1"
serde = "1.0.229"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"

[profile.release]
codegen-units = 1
lto = true

[workspace.lints.cargo]
unused_dependencies = "allow"